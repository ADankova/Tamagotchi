name: Android APK

# Собирает тестовый APK и выкладывает его в релиз «android-latest»,
# откуда его можно скачать прямо на телефон.
on:
  push:
    branches: [main, stage-4-release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Тесты
        run: npm test

      - name: Сборка веб-версии
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android-проект
        run: |
          npx cap add android
          node scripts/android-icons.mjs android/app/src/main/res
          npx cap sync android

      - name: Сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Переименовать APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk tamagotchi-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tamagotchi-debug-apk
          path: tamagotchi-debug.apk

      - name: Обновить релиз android-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest tamagotchi-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Тамагочи для Android — тестовая сборка" \
            --notes "Сборка из ветки ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}.

          Как установить: скачайте tamagotchi-debug.apk на телефон, откройте файл и разрешите установку из этого источника.
          Это отладочная сборка для тестирования, не для Google Play."

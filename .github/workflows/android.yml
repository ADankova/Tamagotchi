name: Android APK

# Собирает тестовый APK и выкладывает его в релиз «android-latest»,
# откуда его можно скачать прямо на телефон.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Тесты
        run: npm test

      - name: Сборка веб-версии
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android-проект
        run: |
          npx cap add android
          node scripts/android-icons.mjs android/app/src/main/res
          node scripts/android-theme.mjs android/app/src/main/res
          npx cap sync android

      - name: Проверка настроек Android
        run: |
          echo "Capacitor CLI: $(npx cap --version)"
          grep -q '"adjustMarginsForEdgeToEdge": "force"' android/app/src/main/assets/capacitor.config.json
          grep -q tamagotchi_background android/app/src/main/res/values/styles.xml
          echo "Отступы от системных панелей и тема на месте."


      - name: Постоянный ключ подписи и номер версии
        run: |
          # Один и тот же ключ — чтобы новые версии ставились поверх старых.
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore
          # versionCode растёт с каждой сборкой, versionName — из package.json.
          VERSION=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Переименовать APK и проверить подпись
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk tamagotchi-debug.apk
          EXPECTED="86:63:04:51:B4:6C:7F:77:BA:65:E5:5A:CC:3F:61:63:79:F3:53:41:3E:58:C8:21:04:F1:CE:4C:DC:CD:BD:8A"
          keytool -printcert -jarfile tamagotchi-debug.apk | tee cert.txt
          grep -q "$EXPECTED" cert.txt && echo "Подпись постоянным ключом — OK"

      - uses: actions/upload-artifact@v4
        with:
          name: tamagotchi-debug-apk
          path: tamagotchi-debug.apk

      - name: Обновить релиз android-latest
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remove_old() {
            # Удаляем прошлые релизы и черновики с этой меткой (черновики не находятся по метке).
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.tag_name == "android-latest") | .id' |
              while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" || true; done
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/android-latest" 2>/dev/null || true
          }
          # Создаём релиз с латинским названием (создание с кириллицей API иногда отклоняет с 500),
          # затем ставим русское описание. При сбоях API пробуем ещё раз.
          for attempt in 1 2 3 4 5; do
            remove_old
            if gh release create android-latest tamagotchi-debug.apk \
                --prerelease --target "$GITHUB_SHA" \
                --title "Tamagotchi for Android (test build)" \
                --notes "Build ${GITHUB_SHA::7}"; then
              gh release edit android-latest \
                --title "Тамагочи для Android — тестовая сборка" \
                --notes "Сборка из ветки ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}.

          Как установить: скачайте tamagotchi-debug.apk на телефон, откройте файл и разрешите установку из этого источника.
          Это отладочная сборка для тестирования, не для Google Play." || echo "Описание не обновилось — не страшно."
              exit 0
            fi
            echo "Попытка $attempt не удалась, ждём..."
            sleep $((attempt * 10))
          done
          exit 1
